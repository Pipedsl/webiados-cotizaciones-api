spring:
  application:
    name: webiados-cotizaciones-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/cotizaciones}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:postgres}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-prod-this-is-a-very-long-dev-secret-key-0123456789}
    admin-ttl-minutes: ${JWT_ADMIN_TTL:480}
    client-ttl-minutes: ${JWT_CLIENT_TTL:30}
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  quote:
    validity-days: ${QUOTE_VALIDITY_DAYS:15}
  mail:
    from: ${MAIL_FROM:cotizaciones@webiados.com}
    notify-to: ${NOTIFY_TO:contacto@webiados.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://webiados.com,https://www.webiados.com,https://cotiza.webiados.com,http://localhost:4200}
  ratelimit:
    unlock-max-attempts: ${RATELIMIT_UNLOCK_MAX:5}
    unlock-window-minutes: ${RATELIMIT_UNLOCK_WINDOW:10}

logging:
  level:
    org.flywaydb: INFO
